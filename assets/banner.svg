<svg width="1000" height="240" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="55%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d1321"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="15%" stop-color="#3b82f6" stop-opacity="1"/>
      <stop offset="85%" stop-color="#60a5fa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="240" fill="url(#bg)"/>
  <rect width="1000" height="240" fill="url(#grid)"/>
  <rect width="1000" height="240" fill="url(#fade)"/>

  <text x="60" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#64748b">
    TRANSFORMING DATA INTO INSIGHTS. <tspan fill="#60a5fa">POWERING SMARTER DECISIONS.</tspan>
  </text>

  <text x="60" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="600" fill="#f5f7fa">
    Vincent Lo&#239;c Monti
  </text>
  <text x="60" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="1" fill="#94a3b8">
    DATA ANALYST &#8201;|&#8201; AI &amp; BIG DATA ENGINEER
  </text>

  <rect x="60" y="180" width="880" height="2" fill="url(#accentLine)"/>

  <circle cx="930" cy="60" r="3" fill="#60a5fa"/>
  <circle cx="950" cy="90" r="2" fill="#3b82f6" fill-opacity="0.6"/>
  <circle cx="910" cy="120" r="2" fill="#60a5fa" fill-opacity="0.5"/>
</svg>
