<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="100%" stop-color="#0D131D"/>
    </linearGradient>
    <pattern id="dfGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <style><![CDATA[
      .df-flow { stroke-dasharray: 4 8; animation: df-flow 3s linear infinite; }
      .df-flow.df-f2 { animation-duration: 3.6s; }
      @keyframes df-flow { to { stroke-dashoffset: -120; } }
      @media (prefers-reduced-motion: reduce) {
        .df-flow { animation: none !important; }
      }
    ]]></style>
  </defs>

  <rect width="1000" height="220" rx="16" fill="url(#dfBg)"/>
  <rect width="1000" height="220" rx="16" fill="url(#dfGrid)"/>
  <rect x="0.5" y="0.5" width="999" height="219" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- spine -->
  <line x1="90" y1="100" x2="910" y2="100" stroke="#8B95A7" stroke-opacity="0.25" stroke-width="1.2"/>
  <line class="df-flow" x1="295" y1="100" x2="500" y2="100" stroke="#3B82F6" stroke-opacity="0.8" stroke-width="1.4"/>
  <line class="df-flow df-f2" x1="705" y1="100" x2="910" y2="100" stroke="#22D3EE" stroke-opacity="0.85" stroke-width="1.4"/>

  <!-- node 1 : DATA -->
  <g transform="translate(90,100)">
    <circle r="27" fill="#0D131D" stroke="#8B95A7" stroke-opacity="0.4" stroke-width="1.3"/>
    <g stroke="#C3CBDA" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="0" cy="-8" rx="9" ry="3.2"/>
      <path d="M -9,-8 L -9,7 A 9,3.2 0 0 0 9,7 L 9,-8"/>
      <path d="M -9,-0.5 A 9,3.2 0 0 0 9,-0.5" stroke-opacity="0.6"/>
    </g>
  </g>
  <text x="90" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1" fill="#C3CBDA">DATA</text>

  <!-- node 2 : DATA ENGINEERING -->
  <g transform="translate(295,100)">
    <circle r="27" fill="#0D131D" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.3"/>
    <path d="M -10,-8 L 10,-8 L 4,9 L -4,9 Z" fill="none" stroke="#9DC0FA" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-1" r="1.6" fill="#9DC0FA"/>
  </g>
  <text x="295" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1" fill="#9DC0FA">DATA ENGINEERING</text>

  <!-- node 3 : ML / AI -->
  <g transform="translate(500,100)">
    <circle r="27" fill="#0D131D" stroke="#3B82F6" stroke-opacity="0.55" stroke-width="1.3"/>
    <path d="M 0,-11 L 9.5,-5.5 L 9.5,5.5 L 0,11 L -9.5,5.5 L -9.5,-5.5 Z" fill="none" stroke="#7FB0FF" stroke-width="1.4" stroke-linejoin="round"/>
    <g fill="#7FB0FF">
      <circle cx="0" cy="-4" r="1.5"/>
      <circle cx="4.5" cy="3" r="1.5"/>
      <circle cx="-4.5" cy="3" r="1.5"/>
    </g>
    <g stroke="#7FB0FF" stroke-width="0.9" stroke-opacity="0.8">
      <line x1="0" y1="-4" x2="4.5" y2="3"/>
      <line x1="0" y1="-4" x2="-4.5" y2="3"/>
      <line x1="4.5" y1="3" x2="-4.5" y2="3"/>
    </g>
  </g>
  <text x="500" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1" fill="#7FB0FF">MACHINE LEARNING / AI</text>

  <!-- node 4 : INSIGHTS -->
  <g transform="translate(705,100)">
    <circle r="27" fill="#0D131D" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.3"/>
    <g fill="#67E8F9">
      <rect x="-9" y="0" width="4.5" height="9" rx="1"/>
      <rect x="-2.2" y="-5" width="4.5" height="14" rx="1"/>
      <rect x="4.6" y="-9" width="4.5" height="18" rx="1"/>
    </g>
  </g>
  <text x="705" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1" fill="#67E8F9">INSIGHTS</text>

  <!-- node 5 : BUSINESS DECISION -->
  <g transform="translate(910,100)">
    <circle r="27" fill="#0D131D" stroke="#22D3EE" stroke-opacity="0.7" stroke-width="1.3"/>
    <path d="M 0,-11 L 11,0 L 0,11 L -11,0 Z" fill="none" stroke="#A5F3FC" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M -4.5,0 L -1,4 L 5,-4" fill="none" stroke="#A5F3FC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="910" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1" fill="#A5F3FC">BUSINESS DECISION</text>

  <text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#5B6472">FROM RAW DATA TO DECISIONS THAT MATTER</text>
</svg>
