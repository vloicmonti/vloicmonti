<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="55%" stop-color="#0A0F1A"/>
      <stop offset="100%" stop-color="#0D131D"/>
    </linearGradient>
    <linearGradient id="titleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="underline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="30%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#070B12" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <style><![CDATA[
      .node { animation: breathe 4.5s ease-in-out infinite; }
      .n0{animation-delay:0s} .n1{animation-delay:.4s} .n2{animation-delay:.8s}
      .n3{animation-delay:1.2s} .n4{animation-delay:1.6s} .n5{animation-delay:2s}
      .n6{animation-delay:2.4s} .n7{animation-delay:2.8s} .n8{animation-delay:.2s}
      .n9{animation-delay:1s} .n10{animation-delay:1.8s} .n11{animation-delay:2.6s}
      @keyframes breathe {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.95; }
      }
      .flow { stroke-dasharray: 6 14; animation: flow 3.2s linear infinite; }
      .flow.f1 { animation-duration: 3.8s; }
      .flow.f2 { animation-duration: 2.6s; }
      @keyframes flow {
        to { stroke-dashoffset: -200; }
      }
      .core { animation: pulseCore 5s ease-in-out infinite; }
      @keyframes pulseCore {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.9; }
      }
      @media (prefers-reduced-motion: reduce) {
        .node, .flow, .core { animation: none !important; opacity: 0.6 !important; }
      }
    ]]></style>
  </defs>

  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#grid)"/>

  <!-- data network motif, right side -->
  <g stroke="#3B82F6" stroke-opacity="0.22" stroke-width="1" fill="none">
    <line x1="640" y1="90" x2="720" y2="60"/>
    <line x1="640" y1="90" x2="700" y2="150"/>
    <line x1="700" y1="150" x2="790" y2="120"/>
    <line x1="790" y1="120" x2="720" y2="60"/>
    <line x1="790" y1="120" x2="860" y2="90"/>
    <line x1="790" y1="120" x2="850" y2="180"/>
    <line x1="850" y1="180" x2="920" y2="150"/>
    <line x1="860" y1="90" x2="930" y2="70"/>
    <line x1="700" y1="150" x2="760" y2="210"/>
    <line x1="760" y1="210" x2="850" y2="180"/>
    <line x1="920" y1="150" x2="960" y2="200"/>
  </g>
  <g stroke="url(#titleAccent)" stroke-opacity="0.75" stroke-width="1.4" fill="none">
    <line class="flow f1" x1="640" y1="90" x2="790" y2="120"/>
    <line class="flow f2" x1="790" y1="120" x2="860" y2="90"/>
    <line class="flow" x1="700" y1="150" x2="790" y2="120"/>
  </g>

  <circle class="core" cx="790" cy="120" r="26" fill="url(#coreGlow)" filter="url(#soft)"/>
  <circle cx="790" cy="120" r="4.5" fill="#EAF2FF"/>

  <g fill="#60A5FA">
    <circle class="node n0" cx="640" cy="90" r="3"/>
    <circle class="node n1" cx="720" cy="60" r="2.5"/>
    <circle class="node n2" cx="700" cy="150" r="3"/>
    <circle class="node n3" cx="860" cy="90" r="2.5"/>
    <circle class="node n4" cx="850" cy="180" r="3"/>
    <circle class="node n5" cx="920" cy="150" r="2.5"/>
    <circle class="node n6" cx="930" cy="70" r="2"/>
    <circle class="node n7" cx="760" cy="210" r="2.5"/>
    <circle class="node n8" cx="960" cy="200" r="2"/>
    <circle class="node n9" cx="600" cy="130" r="2"/>
    <circle class="node n10" cx="970" cy="110" r="2"/>
    <circle class="node n11" cx="820" cy="200" r="2"/>
  </g>

  <rect width="1000" height="280" fill="url(#vignette)"/>

  <!-- text -->
  <text x="60" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="2.5" fill="#8B95A7">
    TRANSFORMING DATA INTO <tspan fill="#60A5FA">INTELLIGENT DECISIONS</tspan>
  </text>

  <text x="60" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="600" fill="#F5F7FA">
    Vincent Lo&#239;c Monti
  </text>

  <text x="60" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="1">
    <tspan fill="#F5F7FA">AI &amp; DATA </tspan><tspan fill="url(#titleAccent)">ENGINEER</tspan>
  </text>

  <rect x="60" y="188" width="230" height="3" rx="1.5" fill="url(#underline)"/>

  <text x="60" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8B95A7">
    Data Analyst building data-driven systems, intelligent
  </text>
  <text x="60" y="243" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8B95A7">
    applications and machine learning solutions.
  </text>
</svg>
